<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Belleza al Día</title>
<meta name="theme-color" content="#D6336C">
<link rel="manifest" href="manifest-belleza.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Belleza al Día">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F2F4;
    --surface:#FFFFFF;
    --surface-2:#FBEEF3;
    --ink:#241820;
    --ink-soft:#7A6670;
    --ink-faint:#B7A3AC;
    --border:#EAD9E0;
    --accent:#D6336C;
    --accent-ink:#FFFFFF;
    --accent-soft:#FBE1EA;
    --nude:#C9A66B;
    --success:#3F8563;
    --success-soft:#E1F0E7;
    --warning:#C68A2E;
    --warning-soft:#FBEEDA;
    --danger:#C4423F;
    --danger-soft:#FBE3E1;
    --shadow:0 10px 28px -14px rgba(36,24,32,.35);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --font-display:'Fraunces','Iowan Old Style',serif;
    --font-body:'Archivo',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1218;
      --surface:#241820;
      --surface-2:#2C1E27;
      --ink:#F5E9EF;
      --ink-soft:#C2A9B4;
      --ink-faint:#8C7480;
      --border:#3B2A33;
      --accent:#F0578C;
      --accent-ink:#241017;
      --accent-soft:#3D2430;
      --nude:#DCB983;
      --success:#6FB78F;
      --success-soft:#1F3A2C;
      --warning:#E0AC58;
      --warning-soft:#3D2E14;
      --danger:#E37F7B;
      --danger-soft:#3E211F;
      --shadow:0 10px 30px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1218;
    --surface:#241820;
    --surface-2:#2C1E27;
    --ink:#F5E9EF;
    --ink-soft:#C2A9B4;
    --ink-faint:#8C7480;
    --border:#3B2A33;
    --accent:#F0578C;
    --accent-ink:#241017;
    --accent-soft:#3D2430;
    --nude:#DCB983;
    --success:#6FB78F;
    --success-soft:#1F3A2C;
    --warning:#E0AC58;
    --warning-soft:#3D2E14;
    --danger:#E37F7B;
    --danger-soft:#3E211F;
    --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); min-height:100vh;}
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
  button{font-family:var(--font-body);}
  ::selection{background:var(--accent-soft);}

  .app{max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); position:relative; isolation:isolate;}
  @media (min-width:560px){
    body{padding:32px 16px;}
    .app{min-height:calc(100vh - 64px); border-radius:28px; box-shadow:var(--shadow); overflow:hidden; border:1px solid var(--border);}
  }

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5;}
  .brand{display:flex; align-items:center; gap:8px; min-width:0;}
  .brand svg{width:22px; height:22px; color:var(--accent); flex-shrink:0;}
  .brand-text{min-width:0;}
  .brand h1{font-size:1.22rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand-sub{font-size:.68rem; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em;}
  .icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:grid; place-items:center; color:var(--ink-soft); cursor:pointer; flex-shrink:0;}
  .icon-btn svg{width:18px; height:18px;}
  .icon-btn:hover{background:var(--surface-2);}
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .view{flex:1; overflow-y:auto; padding:14px 14px 96px; display:flex; flex-direction:column; gap:14px; -webkit-overflow-scrolling:touch;}
  [hidden]{display:none !important;}

  .day-strip{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none;}
  .day-strip::-webkit-scrollbar{display:none;}
  .day-chip{flex:0 0 auto; width:50px; padding:8px 0 7px; border-radius:var(--radius-md); background:var(--surface); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; color:var(--ink-soft);}
  .day-chip .dow{font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .day-chip .num{font-weight:700; font-size:1.05rem; color:var(--ink); font-variant-numeric:tabular-nums;}
  .day-chip.today{box-shadow:inset 0 0 0 1.5px var(--nude);}
  .day-chip.selected{background:var(--accent); border-color:var(--accent);}
  .day-chip.selected .dow, .day-chip.selected .num{color:var(--accent-ink);}
  .day-chip.closed{opacity:.45;}
  .day-chip .dot{width:5px; height:5px; border-radius:50%; background:var(--accent); visibility:hidden;}
  .day-chip.has-appts .dot{visibility:visible;}
  .day-chip.selected .dot{background:var(--accent-ink);}

  .agenda-toolbar{display:flex; align-items:center; gap:4px;}
  .week-label{font-weight:700; font-size:.86rem; color:var(--ink-soft); text-align:center; flex:1; font-variant-numeric:tabular-nums; text-transform:capitalize;}
  .ghost-btn{border:none; background:transparent; color:var(--ink-soft); width:30px; height:30px; border-radius:50%; display:grid; place-items:center; cursor:pointer;}
  .ghost-btn svg{width:16px; height:16px;}
  .ghost-btn:hover{background:var(--surface-2);}
  .today-btn{padding:6px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:.78rem; font-weight:700; color:var(--accent); cursor:pointer;}

  .timeline-wrap{position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;}
  .timeline{position:relative;}
  .hour-row{position:absolute; left:0; right:0; border-top:1px solid var(--border);}
  .hour-row .hour-label{position:absolute; left:8px; top:-7px; font-size:.65rem; font-weight:600; color:var(--ink-faint); background:var(--surface); padding:0 4px; font-variant-numeric:tabular-nums;}
  .timeline-click-area{position:absolute; left:54px; right:0; top:0; bottom:0; cursor:pointer;}
  .appt-block{position:absolute; left:58px; right:8px; border-radius:10px; padding:5px 10px; overflow:hidden; cursor:pointer; border-left:4px solid var(--accent); background:var(--accent-soft); color:var(--ink); box-shadow:0 1px 0 rgba(0,0,0,.03);}
  .appt-block .t{font-weight:700; font-size:.72rem; font-variant-numeric:tabular-nums; opacity:.85;}
  .appt-block .n{font-size:.83rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .appt-block .s{font-size:.72rem; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .appt-block.status-pendiente{border-left-color:var(--warning); background:var(--warning-soft);}
  .appt-block.status-completada{border-left-color:var(--success); background:var(--success-soft);}
  .appt-block.status-cancelada{border-left-color:var(--ink-faint); background:var(--surface-2); opacity:.65;}
  .appt-block.status-cancelada .n{text-decoration:line-through;}
  .appt-block.status-no-asistio{border-left-color:var(--danger); background:var(--danger-soft); opacity:.8;}
  .appt-block.status-no-asistio .n{text-decoration:line-through;}
  .appt-block .ex-tag{font-size:.6rem; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.03em;}
  .closed-note{padding:18px; text-align:center; color:var(--ink-faint); font-size:.85rem;}

  .fab{position:absolute; right:18px; bottom:88px; width:52px; height:52px; border-radius:50%; background:var(--accent); color:var(--accent-ink); border:none; display:grid; place-items:center; box-shadow:var(--shadow); cursor:pointer; z-index:8;}
  .fab svg{width:24px; height:24px;}

  .tabbar{display:flex; border-top:1px solid var(--border); background:var(--surface); position:sticky; bottom:0; z-index:5; padding-bottom:max(6px, env(safe-area-inset-bottom));}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 6px; background:none; border:none; color:var(--ink-faint); font-size:.66rem; font-weight:700; letter-spacing:.01em; cursor:pointer;}
  .tab svg{width:20px; height:20px;}
  .tab.active{color:var(--accent);}

  .search-row input{width:100%; padding:11px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:.9rem;}

  .section-title{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint);}

  .client-list{display:flex; flex-direction:column; gap:8px;}
  .client-card{display:flex; align-items:center; gap:12px; padding:11px 12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); cursor:pointer; text-align:left; width:100%;}
  .client-avatar{width:40px; height:40px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-weight:700; font-family:var(--font-display); font-size:1rem; flex-shrink:0;}
  .client-card .info{flex:1; min-width:0;}
  .name-row{display:flex; align-items:center; gap:6px; min-width:0;}
  .client-card .name{font-weight:700; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .client-card .meta{font-size:.76rem; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ex-badge{flex-shrink:0; font-size:.6rem; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:2px 7px; border-radius:999px; text-transform:uppercase; letter-spacing:.02em;}
  .last-pill{font-size:.66rem; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); flex-shrink:0; white-space:nowrap;}

  .empty-state{text-align:center; color:var(--ink-faint); padding:34px 20px; font-size:.86rem; background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius-lg);}

  .sheet-backdrop{position:absolute; inset:0; background:rgba(20,12,16,.42); display:flex; align-items:flex-end; z-index:20;}
  .sheet{background:var(--surface); width:100%; max-height:90vh; overflow-y:auto; border-radius:22px 22px 0 0; padding:10px 18px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow); animation:sheet-in .2s ease;}
  @keyframes sheet-in{from{transform:translateY(18px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  @media (prefers-reduced-motion: reduce){.sheet{animation:none;}}
  .sheet-handle{width:36px; height:4px; border-radius:2px; background:var(--border); margin:6px auto 0;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .sheet-title{font-size:1.1rem; font-weight:600;}

  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:.72rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field select, .field textarea{width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:.92rem;}
  .field textarea{resize:vertical; min-height:64px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .autocomplete{position:relative;}
  .autocomplete-list{position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:var(--shadow); z-index:5; max-height:160px; overflow-y:auto;}
  .autocomplete-item{padding:9px 12px; font-size:.87rem; cursor:pointer;}
  .autocomplete-item:hover, .autocomplete-item.active{background:var(--accent-soft);}

  .service-check-list{display:flex; flex-direction:column; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden;}
  label.service-check{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; background:var(--bg); text-transform:none; letter-spacing:normal; font-size:.87rem; font-weight:400; color:var(--ink);}
  .service-check:last-child{border-bottom:none;}
  .service-check input{width:18px; height:18px; accent-color:var(--accent); flex-shrink:0;}
  .service-check .svc-name{flex:1; font-weight:600;}
  .service-check .svc-min{color:var(--ink-faint); font-size:.76rem; font-weight:600; font-variant-numeric:tabular-nums;}
  .custom-service-row{display:flex; gap:8px; margin-top:8px;}
  .custom-service-row input[type="text"]{flex:2;}
  .custom-service-row input[type="number"]{flex:1; min-width:0;}
  .custom-service-row button{flex-shrink:0; padding:0 14px; font-size:.82rem;}
  .extra-svc-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .extra-svc-tag{display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent); padding:5px 6px 5px 11px; border-radius:999px; font-size:.78rem; font-weight:700;}
  .tag-remove{width:18px; height:18px; border-radius:50%; border:none; background:rgba(0,0,0,.08); color:inherit; display:grid; place-items:center; cursor:pointer; padding:0;}
  .tag-remove svg{width:10px; height:10px;}

  .btn{padding:12px 16px; border-radius:999px; border:none; font-weight:700; font-size:.9rem; cursor:pointer;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-secondary{background:var(--surface-2); color:var(--ink);}
  .btn-danger{background:var(--danger-soft); color:var(--danger);}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  a.btn{text-decoration:none; display:inline-flex; align-items:center; justify-content:center;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}
  .btn-icon{display:inline-flex; align-items:center; justify-content:center; gap:7px;}
  .btn-icon svg{width:16px; height:16px;}

  .conflict-warning{background:var(--danger-soft); color:var(--danger); padding:9px 11px; border-radius:10px; font-size:.82rem; font-weight:600; display:flex; gap:8px; align-items:flex-start;}
  .conflict-warning svg{width:16px; height:16px; flex-shrink:0; margin-top:1px;}

  .status-pill{display:inline-flex; align-items:center; gap:4px; font-size:.66rem; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; flex-shrink:0;}
  .status-pill.confirmada{background:var(--success-soft); color:var(--success);}
  .status-pill.pendiente{background:var(--warning-soft); color:var(--warning);}
  .status-pill.cancelada{background:var(--surface-2); color:var(--ink-faint);}
  .status-pill.completada{background:var(--accent-soft); color:var(--accent);}
  .status-pill.no-asistio{background:var(--danger-soft); color:var(--danger);}
  .noshow-badge{display:inline-flex; align-items:center; gap:4px; font-size:.7rem; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--danger-soft); color:var(--danger);}

  .detail-header{display:flex; align-items:center; gap:12px;}
  .detail-header .client-avatar{width:52px; height:52px; font-size:1.2rem;}
  .detail-header .name{font-size:1.15rem; font-weight:700;}
  .detail-header .phone{font-size:.84rem; color:var(--ink-soft);}
  .quick-actions{display:flex; gap:8px;}
  .quick-actions .btn{flex:1; padding:10px;}

  .photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .photo-thumb{position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; background:var(--surface-2);}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-thumb .del{position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(20,12,16,.55); color:#fff; display:grid; place-items:center; border:none; cursor:pointer; padding:0;}
  .photo-thumb .del svg{width:12px; height:12px;}
  .photo-add{border:1.5px dashed var(--border); border-radius:12px; aspect-ratio:1; display:grid; place-items:center; color:var(--ink-faint); cursor:pointer; background:none;}
  .photo-add svg{width:22px; height:22px;}

  .history-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .history-row:last-child{border-bottom:none;}
  .history-row .hd{min-width:0;}
  .history-row .hdate{font-weight:700; font-size:.85rem; text-transform:capitalize;}
  .history-row .hserv{font-size:.78rem; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .weekday-picker{display:flex; gap:6px; flex-wrap:wrap;}
  .weekday-chip{width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--bg); display:grid; place-items:center; font-size:.68rem; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .weekday-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .service-row{display:flex; gap:8px; align-items:flex-end;}
  .service-row input[type="text"]{flex:2;}
  .service-row .svc-field{flex:1; min-width:0; display:flex; flex-direction:column;}
  .service-row .svc-field input[type="number"]{width:100%;}
  .service-row button{flex-shrink:0;}
  .service-row-group{margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--border);}
  .service-row-group:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
  .service-row-group .svcName{width:100%; margin-bottom:6px;}
  .svc-field-label{display:block; font-size:11px; color:var(--ink-faint); margin-bottom:3px;}

  .backup-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; display:flex; flex-direction:column; gap:10px;}
  .backup-meta{font-size:.82rem; color:var(--ink-soft);}
  .backup-meta b{color:var(--ink); font-variant-numeric:tabular-nums;}

  .income-toggle{display:flex; gap:8px;}
  .chip-toggle{flex:1; padding:9px 0; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:.82rem; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .chip-toggle.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .income-tip{background:var(--warning-soft); color:var(--warning); border-radius:var(--radius-md); padding:11px 13px; font-size:.8rem; line-height:1.4;}
  .income-total-label{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint);}
  .income-total-amount{font-size:2rem; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums;}
  .income-total-meta{font-size:.82rem; color:var(--ink-soft);}
  .income-svc-list{display:flex; flex-direction:column;}
  .income-svc-row{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); font-size:.86rem;}
  .income-svc-row:last-child{border-bottom:none;}
  .income-svc-name{flex:1; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .income-svc-count{color:var(--ink-faint); font-size:.78rem; flex-shrink:0;}
  .income-svc-total{font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; flex-shrink:0;}
  .muted-text{font-size:.82rem; color:var(--ink-soft); line-height:1.5;}
  .example-banner{background:var(--accent-soft); color:var(--accent); border-radius:var(--radius-md); padding:12px 14px; font-size:.82rem; display:flex; flex-direction:column; gap:8px;}

  .toast{position:absolute; left:50%; bottom:96px; transform:translate(-50%,6px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.82rem; font-weight:700; box-shadow:var(--shadow); z-index:40; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; max-width:88%; text-align:center;}
  .toast.show{opacity:1; transform:translate(-50%,0);}

  .confirm-sheet .sheet-title{margin-bottom:2px;}
  .confirm-sheet p{margin:0; font-size:.88rem; color:var(--ink-soft); line-height:1.5;}

  .license-gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg);}
  .gate-card{max-width:380px; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px 26px; text-align:center; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px;}
  .gate-icon{width:36px; height:36px; color:var(--accent); margin:0 auto 10px;}
  .gate-card h1{font-size:1.3rem; margin-bottom:2px;}
  .gate-card .field{margin-top:14px;}

<script>
(function(){
"use strict";

/* ---------------- Storage ----------------
   Minimal IndexedDB key/value store (no external library needed).
   Falls back to localStorage for plain JSON values if IndexedDB is unavailable
   (Blobs — the photos — require IndexedDB and simply won't persist in that
   rare fallback case; everything else keeps working). */
var DB_NAME = "unasAlDiaDB", DB_STORE = "kv", dbPromise = null;
function openDB(){
  return new Promise(function(resolve, reject){
    if (!window.indexedDB){ reject(new Error("no-indexeddb")); return; }
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(DB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function getDB(){ if (!dbPromise) dbPromise = openDB(); return dbPromise; }
var store = {
  getItem: function(key){
    return getDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readonly");
        var req = tx.objectStore(DB_STORE).get(key);
        req.onsuccess = function(){ resolve(req.result === undefined ? null : req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    }).catch(function(){
      try { var raw = localStorage.getItem("kv:" + key); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
    });
  },
  setItem: function(key, value){
    return getDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(value, key);
        tx.oncomplete = function(){ resolve(value); };
        tx.onerror = function(){ reject(tx.error); };
      });
    }).catch(function(){
      try { localStorage.setItem("kv:" + key, JSON.stringify(value)); } catch(e){}
      return value;
    });
  },
  removeItem: function(key){
    return getDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    }).catch(function(){ try { localStorage.removeItem("kv:" + key); } catch(e){} });
  }
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function defaultSettings(){
  return {
    businessName: "",
    startMin: 600,   // 10:00
    endMin: 1140,    // 19:00
    closedWeekdays: [0, 1], // 0=domingo, 1=lunes (Date.getDay())
    services: [
      { id: uid(), name: "Corte de cabello", durationMin: 45, price: 0 },
      { id: uid(), name: "Peinado", durationMin: 40, price: 0 },
      { id: uid(), name: "Manicure", durationMin: 40, price: 0 }
    ]
  };
}

var state = {
  clients: [],
  appointments: [],
  settings: defaultSettings(),
  selectedDate: startOfDay(new Date()),
  weekStart: startOfWeek(new Date()),
  activeView: "agenda",
  activeClientId: null,
  lastBackupAt: null
};

var objectUrls = [];
function trackUrl(url){ objectUrls.push(url); return url; }
function releaseTrackedUrls(){ objectUrls.forEach(function(u){ try{ URL.revokeObjectURL(u); }catch(e){} }); objectUrls = []; }

/* ---------------- Date / time helpers ---------------- */
var DOW_SHORT = ["DOM","LUN","MAR","MIÉ","JUE","VIE","SÁB"];
var DOW_LONG  = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MONTHS    = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function pad2(n){ return String(n).padStart(2,"0"); }
function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
function startOfWeek(d){ var x = startOfDay(d); var day = (x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtISO(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function parseISO(s){ var p = s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function minToHHMM(min){ min = ((min % 1440) + 1440) % 1440; return pad2(Math.floor(min/60)) + ":" + pad2(min%60); }
function hhmmToMin(hhmm){ var p = hhmm.split(":").map(Number); return p[0]*60 + p[1]; }
function sameDate(a,b){ return fmtISO(a) === fmtISO(b); }

/* ---------------- Data access helpers ---------------- */
function getClient(id){ return state.clients.find(function(c){ return c.id === id; }); }
function apptsOnDate(iso){ return state.appointments.filter(function(a){ return a.date === iso; }).sort(function(a,b){ return a.startMin-b.startMin; }); }
var STATUS_LABEL = { confirmada:"Confirmada", pendiente:"Pendiente", completada:"Completada", cancelada:"Cancelada", "no-asistio":"No se presentó" };
function statusLabel(status){ return STATUS_LABEL[status] || status; }
function noShowCount(clientId){ return state.appointments.filter(function(a){ return a.clientId === clientId && a.status === "no-asistio"; }).length; }
function isClosedWeekday(date){ return state.settings.closedWeekdays.indexOf(date.getDay()) !== -1; }

function findConflict(dateISO, startMin, durationMin, excludeApptId){
  var endMin = startMin + durationMin;
  return state.appointments.find(function(a){
    if (a.date !== dateISO) return false;
    if (a.id === excludeApptId) return false;
    if (a.status === "cancelada") return false;
    var aEnd = a.startMin + a.durationMin;
    return !(endMin <= a.startMin || startMin >= aEnd);
  });
}

function normalizePhone(raw){
  var digits = (raw || "").replace(/\D/g, "");
  if (digits.length === 10) digits = "52" + digits;
  return digits;
}
function waLink(phone, text){
  var d = normalizePhone(phone);
  var url = "https://wa.me/" + d;
  if (text) url += "?text=" + encodeURIComponent(text);
  return url;
}
function displayName(name){ return (name || "").replace(/\s*\(ejemplo\)\s*$/i, ""); }
function esc(s){ return (s == null ? "" : String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function joinNatural(list){
  list = (list || []).filter(Boolean);
  if (!list.length) return "";
  if (list.length === 1) return list[0];
  if (list.length === 2) return list[0] + " y " + list[1];
  return list.slice(0, -1).join(", ") + " y " + list[list.length - 1];
}
function apptServiceLabel(a){ return joinNatural((a.services || []).map(function(s){ return s.name; })); }
function buildConfirmMessage(appt){
  var d = parseISO(appt.date);
  var line = "Hola " + displayName(appt.clientName) + ", tu cita para " + apptServiceLabel(appt) +
    " quedó agendada el " + DOW_LONG[d.getDay()] + " " + d.getDate() + " de " + MONTHS[d.getMonth()] +
    " a las " + minToHHMM(appt.startMin) + " hrs (dura aprox. " + appt.durationMin + " min).";
  var notes = appt.notes ? ("\nNotas: " + appt.notes) : "";
  var biz = state.settings.businessName ? ("\n" + state.settings.businessName) : "";
  return line + notes + "\n¡Te espero! 💅" + biz;
}
function buildReminderMessage(appt){
  var line = "Hola " + displayName(appt.clientName) + ", te recuerdo tu cita de hoy a las " +
    minToHHMM(appt.startMin) + " hrs para " + apptServiceLabel(appt) + ".";
  var biz = state.settings.businessName ? ("\n" + state.settings.businessName) : "";
  return line + "\n¡Te espero! 💅" + biz;
}

/* ---------------- Persistence ---------------- */
function saveClients(){ return store.setItem("clients", state.clients); }
function saveAppointments(){ return store.setItem("appointments", state.appointments); }
function saveSettings(){ return store.setItem("settings", state.settings); }
function saveMeta(){ return store.setItem("meta", { lastBackupAt: state.lastBackupAt }); }

async function loadAll(){
  var c = await store.getItem("clients");
  var a = await store.getItem("appointments");
  var s = await store.getItem("settings");
  var m = await store.getItem("meta");
  if (c && c.length){ state.clients = c; }
  if (a && a.length){ state.appointments = a; }
  if (s){ state.settings = s; }
  if (m && m.lastBackupAt){ state.lastBackupAt = m.lastBackupAt; }

  /* Migrate appointments saved before multi-service support (single "service" string) */
  state.appointments.forEach(function(ap){
    if (!Array.isArray(ap.services)){
      ap.services = ap.service ? [{ name: ap.service, durationMin: ap.durationMin || 30 }] : [];
    }
  });

  if (!c || !c.length){
    await seedExamples();
  }
}

async function seedExamples(){
  var today = new Date();
  var todayISO = fmtISO(today);
  var tomorrowISO = fmtISO(addDays(today,1));
  var ana = { id: uid(), name: "Ana Torres (ejemplo)", phone: "5215512345678",
    notes: "Prefiere tonos naturales, piel sensible.", photos: [], isExample: true, createdAt: Date.now() };
  var karla = { id: uid(), name: "Karla Méndez (ejemplo)", phone: "5215587654321",
    notes: "Le gusta que le sugieran looks nuevos.", photos: [], isExample: true, createdAt: Date.now() };
  state.clients = [ana, karla];

  var svcA = state.settings.services[0];
  var svcB = state.settings.services[1] || svcA;
  var t1 = Math.max(state.settings.startMin, 660);
  var t2 = Math.min(state.settings.endMin - 90, 1020);
  state.appointments = [
    { id: uid(), clientId: ana.id, clientName: ana.name, clientPhone: ana.phone,
      date: todayISO, startMin: t1, durationMin: svcA.durationMin + svcB.durationMin,
      services: [{ name: svcA.name, durationMin: svcA.durationMin }, { name: svcB.name, durationMin: svcB.durationMin }],
      notes: "", status: "confirmada", isExample: true, createdAt: Date.now() },
    { id: uid(), clientId: karla.id, clientName: karla.name, clientPhone: karla.phone,
      date: tomorrowISO, startMin: t2, durationMin: svcA.durationMin,
      services: [{ name: svcA.name, durationMin: svcA.durationMin }],
      notes: "Traer referencia de estilo si tiene alguna en mente", status: "confirmada", isExample: true, createdAt: Date.now() }
  ];
  await saveClients();
  await saveAppointments();
}

async function clearExamples(){
  state.clients = state.clients.filter(function(c){ return !c.isExample; });
  state.appointments = state.appointments.filter(function(a){ return !a.isExample; });
  await saveClients();
  await saveAppointments();
  renderActiveView();
  showToast("Datos de ejemplo eliminados");
}

/* ---------------- Toast ---------------- */
var toastTimer = null;
function showToast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2400);
}

/* ---------------- Modal / sheet helpers ---------------- */
function closeSheet(){
  var root = document.getElementById("modalRoot");
  root.innerHTML = "";
  releaseTrackedUrls();
}
function openSheet(innerHTML, opts){
  opts = opts || {};
  var root = document.getElementById("modalRoot");
  var backdrop = document.createElement("div");
  backdrop.className = "sheet-backdrop";
  backdrop.innerHTML = '<div class="sheet' + (opts.extraClass ? " " + opts.extraClass : "") + '"><div class="sheet-handle"></div>' + innerHTML + '</div>';
  backdrop.addEventListener("mousedown", function(e){ if (e.target === backdrop) closeSheet(); });
  root.innerHTML = "";
  root.appendChild(backdrop);
  if (opts.onMount) opts.onMount(backdrop);
}
function openConfirm(opts){
  openSheet(
    '<div class="confirm-sheet">' +
      '<div class="sheet-title">' + opts.title + "</div>" +
      "<p>" + opts.message + "</p>" +
      '<div class="btn-row" style="margin-top:6px;">' +
        '<button class="btn btn-secondary" id="cfCancel">Cancelar</button>' +
        '<button class="btn ' + (opts.danger ? "btn-danger" : "btn-primary") + '" id="cfOk">' + (opts.confirmLabel || "Confirmar") + "</button>" +
      "</div>" +
    "</div>",
    { onMount: function(root){
        root.querySelector("#cfCancel").addEventListener("click", closeSheet);
        root.querySelector("#cfOk").addEventListener("click", function(){ closeSheet(); opts.onConfirm && opts.onConfirm(); });
      }
    }
  );
}

/* ---------------- Tab / view switching ---------------- */
function setActiveView(name){
  state.activeView = name;
  ["agenda","clients","client-detail","income","backup"].forEach(function(v){
    document.getElementById("view-" + v).hidden = (v !== name);
  });
  document.querySelectorAll(".tab").forEach(function(t){
    t.classList.toggle("active", t.dataset.view === name || (name === "client-detail" && t.dataset.view === "clients"));
  });
  document.getElementById("fabBtn").hidden = (name === "client-detail" || name === "backup" || name === "income");
  renderActiveView();
}
function renderActiveView(){
  if (state.activeView === "agenda") { renderDayStrip(); renderTimeline(); }
  else if (state.activeView === "clients") { renderClientList(); }
  else if (state.activeView === "client-detail") { renderClientDetail(state.activeClientId); }
  else if (state.activeView === "income") { renderIncomeView(); }
  else if (state.activeView === "backup") { renderBackupView(); }

/* ---------------- Horarios libres de la semana ---------------- */
var FREE_SLOT_MIN_GAP = 15; // minutos; huecos más chicos que esto no se muestran

function freeGapsForDate(iso){
  var start = state.settings.startMin;
  var end = state.settings.endMin;
  var busy = apptsOnDate(iso).filter(function(a){ return a.status !== "cancelada"; });
  var gaps = [];
  var cursor = start;
  busy.forEach(function(a){
    var aStart = a.startMin;
    var aEnd = a.startMin + a.durationMin;
    if (aStart > cursor && (aStart - cursor) >= FREE_SLOT_MIN_GAP) gaps.push({ startMin: cursor, endMin: aStart });
    cursor = Math.max(cursor, aEnd);
  });
  if (end > cursor && (end - cursor) >= FREE_SLOT_MIN_GAP) gaps.push({ startMin: cursor, endMin: end });
  return gaps;
}

function computeFreeWeek(){
  var today = startOfDay(new Date());
  var sunday = addDays(startOfWeek(today), 6);
  var days = [];
  for (var d = today; d <= sunday; d = addDays(d,1)){
    if (isClosedWeekday(d)) continue;
    var iso = fmtISO(d);
    var gaps = freeGapsForDate(iso);
    days.push({ date: d, iso: iso, gaps: gaps });
  }
  return days;
}

function dayLabelLong(d){
  var name = DOW_LONG[d.getDay()];
  return name.charAt(0).toUpperCase() + name.slice(1) + " " + d.getDate() + " de " + MONTHS[d.getMonth()];
}

function buildFreeSlotsMessage(days){
  var withGaps = days.filter(function(x){ return x.gaps.length; });
  var lines = withGaps.map(function(x){
    var ranges = x.gaps.map(function(g){ return minToHHMM(g.startMin) + "–" + minToHHMM(g.endMin); }).join(", ");
    return dayLabelLong(x.date) + ": " + ranges;
  });
  var biz = state.settings.businessName ? (" en " + state.settings.businessName) : "";
  var head = "Hola, estos son los horarios que tengo libres esta semana" + biz + ":";
  return head + "\n\n" + lines.join("\n") + "\n\n¿Cuál te acomoda? 💅";
}

function freeSlotsSheetHTML(days){

    sendBtn +

/* ---------------- Agenda: day strip ---------------- */
function renderDayStrip(){
  var strip = document.getElementById("dayStrip");
  strip.innerHTML = "";
  var today = startOfDay(new Date());
  for (var i=0;i<7;i++){
    var d = addDays(state.weekStart, i);
    var iso = fmtISO(d);
    var chip = document.createElement("button");
    chip.className = "day-chip";
    if (sameDate(d, today)) chip.classList.add("today");
    if (sameDate(d, state.selectedDate)) chip.classList.add("selected");
    if (isClosedWeekday(d)) chip.classList.add("closed");
    var hasAppts = apptsOnDate(iso).some(function(a){ return a.status !== "cancelada"; });
    if (hasAppts) chip.classList.add("has-appts");
    chip.innerHTML = '<span class="dow">' + DOW_SHORT[d.getDay()] + '</span><span class="num">' + d.getDate() + '</span><span class="dot"></span>';
    chip.addEventListener("click", function(dd){ return function(){ state.selectedDate = dd; renderDayStrip(); renderTimeline(); }; }(d));
    strip.appendChild(chip);
  }
  var weekEnd = addDays(state.weekStart, 6);
  var label;
  if (weekStartEndSameMonth(state.weekStart, weekEnd)){
    label = state.weekStart.getDate() + " – " + weekEnd.getDate() + " de " + MONTHS[weekEnd.getMonth()];
  } else {
    label = state.weekStart.getDate() + " " + MONTHS[state.weekStart.getMonth()].slice(0,3) + " – " + weekEnd.getDate() + " " + MONTHS[weekEnd.getMonth()].slice(0,3);
  }
  document.getElementById("weekLabel").textContent = label;
}
function weekStartEndSameMonth(a,b){ return a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear(); }

/* ---------------- Agenda: timeline ---------------- */
var PX_PER_MIN = 1.6;
var TIMELINE_TOP_PAD = 16;
function renderTimeline(){
  var wrap = document.getElementById("timeline");
  wrap.innerHTML = "";
  var iso = fmtISO(state.selectedDate);
  var s = state.settings;

  if (isClosedWeekday(state.selectedDate)){
    wrap.style.height = "120px";
    wrap.innerHTML = '<div class="closed-note">Día de descanso — no hay horario de atención.<br>Puedes cambiar esto en Ajustes.</div>';
    return;
  }

  var totalMin = s.endMin - s.startMin;
  var height = totalMin * PX_PER_MIN + TIMELINE_TOP_PAD + 10;
  wrap.style.height = height + "px";

  var clickArea = document.createElement("div");
  clickArea.className = "timeline-click-area";
  clickArea.style.top = TIMELINE_TOP_PAD + "px";
  clickArea.addEventListener("click", function(e){
    var rect = clickArea.getBoundingClientRect();
    var y = e.clientY - rect.top;
    var minute = s.startMin + Math.round((y / PX_PER_MIN) / 5) * 5;
    minute = Math.max(s.startMin, Math.min(s.endMin - 15, minute));
    openApptSheet(null, { date: iso, startMin: minute });
  });
  wrap.appendChild(clickArea);

  var firstHour = Math.ceil(s.startMin / 60) * 60;
  for (var h = firstHour; h <= s.endMin; h += 60){
    var row = document.createElement("div");
    row.className = "hour-row";
    row.style.top = ((h - s.startMin) * PX_PER_MIN + TIMELINE_TOP_PAD) + "px";
    row.innerHTML = '<span class="hour-label">' + minToHHMM(h) + "</span>";
    wrap.appendChild(row);
  }

  var appts = apptsOnDate(iso);
  appts.forEach(function(a){
    var top = (a.startMin - s.startMin) * PX_PER_MIN + TIMELINE_TOP_PAD;
    var h = Math.max(30, a.durationMin * PX_PER_MIN);
    var block = document.createElement("div");
    block.className = "appt-block status-" + a.status;
    block.style.top = top + "px";
    block.style.height = h + "px";
    block.innerHTML =
      '<div class="t">' + minToHHMM(a.startMin) + "–" + minToHHMM(a.startMin + a.durationMin) + "</div>" +
      '<div class="n">' + esc(displayName(a.clientName)) + "</div>" +
      '<div class="s">' + esc(apptServiceLabel(a)) + "</div>" +
      (a.isExample ? '<div class="ex-tag">Ejemplo</div>' : "");
    block.addEventListener("click", function(appt){ return function(){ openApptSheet(appt); }; }(a));
    wrap.appendChild(block);
  });
}

      if (conflict){
        fConflict.hidden = false;
        fConflict.querySelector("span").textContent = "Se cruza con la cita de " + displayName(conflict.clientName) + " a las " + minToHHMM(conflict.startMin) + " (" + apptServiceLabel(conflict) + ").";
        /* textContent is used above, so no HTML-escaping is needed for this warning */
        return true;
      }
      fConflict.hidden = true;
      return false;
    }
    /* Valida que la cita quede dentro del horario de atención configurado en
       Ajustes (hora de apertura/cierre) y que el día no sea un día de
       descanso — evita agendar fuera del rango que la dueña estableció. */
    function checkHours(){
      var dateISO = fDate.value;
      if (!dateISO){ fHoursWarn.hidden = true; return false; }
      var startMin = hhmmToMin(fTime.value || "00:00");
      var dur = parseInt(fDur.value,10) || 0;
      var s = state.settings;
      var msg = "";
      if (isClosedWeekday(parseISO(dateISO))){
        msg = "Ese día (" + DOW_LONG[parseISO(dateISO).getDay()] + ") es tu día de descanso. Cámbialo en Ajustes si quieres atender ese día.";
      } else if (startMin < s.startMin || (startMin + dur) > s.endMin){
        msg = "Ese horario queda fuera de tu horario de atención (" + minToHHMM(s.startMin) + "–" + minToHHMM(s.endMin) + "). Puedes ajustarlo en Ajustes.";
      }
      if (msg){
        fHoursWarn.hidden = false;
        fHoursWarn.querySelector("span").textContent = msg;
        return true;
      }
      fHoursWarn.hidden = true;
      return false;
    }
    [fDate, fTime, fDur].forEach(function(el){ el.addEventListener("input", function(){ checkConflict(); checkHours(); }); });
    checkConflict(); checkHours();

    fName.addEventListener("input", function(){
      var q = fName.value.trim().toLowerCase();
      selectedClientId = null;
      if (!q){ fSuggest.hidden = true; return; }
      var matches = state.clients.filter(function(c){
        return c.name.toLowerCase().indexOf(q) !== -1 || (c.phone||"").indexOf(q) !== -1;
      }).slice(0,5);
      if (!matches.length){ fSuggest.hidden = true; return; }
      fSuggest.innerHTML = matches.map(function(c){
        return '<div class="autocomplete-item" data-id="' + c.id + '">' + esc(displayName(c.name)) + '<br><small style="color:var(--ink-faint)">' + esc(c.phone) + "</small></div>";
      }).join("");
      fSuggest.hidden = false;
      fSuggest.querySelectorAll(".autocomplete-item").forEach(function(item){
        item.addEventListener("click", function(){
          var c = getClient(item.dataset.id);
          if (c){ fName.value = displayName(c.name); fPhone.value = c.phone; selectedClientId = c.id; }
          fSuggest.hidden = true;
          updatePhoneHint();
        });
      });
    });
    root.addEventListener("click", function(e){
      if (e.target !== fName) fSuggest.hidden = true;
    });

    /* Detecta por teléfono si ya es una clienta registrada (sin importar si
       lo escribió con espacios, guiones, o con/sin código de país), para
       no crear una clienta duplicada y para que se vea en el momento. */
    function updatePhoneHint(){
      var hint = $("#fPhoneHint");
      var digits = fPhone.value.replace(/\D/g, "");
      if (digits.length < 10){ hint.hidden = true; return; }
      var norm = normalizePhone(fPhone.value);
      var match = state.clients.find(function(c){ return normalizePhone(c.phone) === norm; });
      hint.hidden = false;
      if (match){
        selectedClientId = match.id;
        if (!fName.value.trim()) fName.value = displayName(match.name);
        hint.className = "phone-hint existing";
        hint.textContent = "Ya es tu clienta: " + displayName(match.name);
      } else {
        hint.className = "phone-hint new";
        hint.textContent = "Se registrará como clienta nueva";
      }
    }
    fPhone.addEventListener("input", updatePhoneHint);
    updatePhoneHint();

    function collectAndSave(cb){
      var name = fName.value.trim();
      var phone = fPhone.value.trim();
      if (!name || !phone){ showToast("Falta el nombre o el teléfono"); return; }
      var services = collectSelectedServices();
      if (!services.length){ showToast("Elige al menos un servicio"); return; }
      var dateISO = fDate.value, startMin = hhmmToMin(fTime.value), dur = parseInt(fDur.value,10) || services.reduce(function(s,x){return s+x.durationMin;},0);

      if (findConflict(dateISO, startMin, dur, isEdit ? appt.id : null)){
        checkConflict();
        showToast("Ese horario ya está ocupado");
        return;
      }
      if (checkHours()){
        showToast("Ese horario está fuera de tu horario de atención");
        return;
      }

      var clientId = selectedClientId;
      var isNewClient = false;
      if (!clientId){
        var existingByPhone = state.clients.find(function(c){ return normalizePhone(c.phone) === normalizePhone(phone); });
        if (existingByPhone){ clientId = existingByPhone.id; existingByPhone.name = name; }
        else {
          var nc = { id: uid(), name: name, phone: phone, notes: "", photos: [], isExample:false, createdAt: Date.now() };
          state.clients.push(nc);
          clientId = nc.id;
          isNewClient = true;
        }
      } else {
        var ec = getClient(clientId); if (ec){ ec.name = name; ec.phone = phone; }
      }

      appt.clientId = clientId; appt.clientName = name; appt.clientPhone = phone;
      appt.services = services; appt.date = dateISO; appt.startMin = startMin; appt.durationMin = dur;
      appt.notes = fNotes.value.trim(); appt.status = appt.status || "confirmada"; appt.isExample = false;

      if (!isEdit) state.appointments.push(appt);
      Promise.all([saveClients(), saveAppointments()]).then(function(){
        closeSheet();
        state.selectedDate = parseISO(dateISO);
        state.weekStart = startOfWeek(state.selectedDate);
        renderDayStrip(); renderTimeline();
        showToast(isEdit ? "Cita actualizada" : (isNewClient ? "Cita agendada · clienta nueva agregada" : "Cita agendada"));
        window.open(waLink(phone, buildConfirmMessage(appt)), "_blank", "noopener");
        cb && cb();
      });
    }

    $("#fSave").addEventListener("click", function(){ collectAndSave(); });
    $("#fClose").addEventListener("click", closeSheet);

    if (isEdit){
      var delBtn = $("#fDelete");
      if (delBtn) delBtn.addEventListener("click", function(){
        openConfirm({ title:"Eliminar cita", message:"Esta cita se eliminará por completo. Esta acción no se puede deshacer.", confirmLabel:"Eliminar", danger:true,
          onConfirm: function(){
            state.appointments = state.appointments.filter(function(a){ return a.id !== appt.id; });
            saveAppointments().then(function(){ renderDayStrip(); renderTimeline(); showToast("Cita eliminada"); });
          }});
      });
      var compBtn = $("#fComplete");
      if (compBtn) compBtn.addEventListener("click", function(){
        appt.status = "completada"; saveAppointments().then(function(){ closeSheet(); renderTimeline(); renderDayStrip(); showToast("Cita marcada como completada"); });
      });
      var cancelBtn = $("#fCancelAppt");
      if (cancelBtn) cancelBtn.addEventListener("click", function(){
        openConfirm({ title:"Cancelar cita", message:"Se liberará este horario para poder agendar a alguien más.", confirmLabel:"Sí, cancelar", danger:true,
          onConfirm:function(){ appt.status = "cancelada"; saveAppointments().then(function(){ closeSheet(); renderTimeline(); renderDayStrip(); showToast("Cita cancelada"); }); }});
      });
      var reactBtn = $("#fReactivate");
      if (reactBtn) reactBtn.addEventListener("click", function(){
        if (findConflict(appt.date, appt.startMin, appt.durationMin, appt.id)){ showToast("Ese horario ya se ocupó, cambia la hora primero"); return; }
        appt.status = "confirmada"; saveAppointments().then(function(){ closeSheet(); renderTimeline(); renderDayStrip(); showToast("Cita reactivada"); });
      });
      var noShowBtn = $("#fNoShow");
      if (noShowBtn) noShowBtn.addEventListener("click", function(){
        appt.status = "no-asistio"; saveAppointments().then(function(){ closeSheet(); renderTimeline(); renderDayStrip(); showToast('Cita marcada como "no se presentó"'); });
      });
    }
  }});
}

/* ---------------- Clients list ---------------- */
function initials(name){
  var n = displayName(name).trim();
  var parts = n.split(/\s+/);
  return ((parts[0]||"")[0]||"") .toUpperCase() + ((parts[1]||"")[0]||"").toUpperCase();
}
function lastVisit(clientId){
  var past = state.appointments.filter(function(a){ return a.clientId === clientId && a.status !== "cancelada" && a.status !== "no-asistio"; })
    .sort(function(a,b){ return (b.date+b.startMin) < (a.date+a.startMin) ? -1 : 1; });
  return past[0];
}
function renderClientList(){
  var list = document.getElementById("clientList");
  var q = (document.getElementById("clientSearch").value || "").trim().toLowerCase();
  var clients = state.clients.filter(function(c){
    return !q || c.name.toLowerCase().indexOf(q) !== -1 || (c.phone||"").indexOf(q) !== -1;
  }).sort(function(a,b){ return displayName(a.name).localeCompare(displayName(b.name)); });

  if (!clients.length){
    list.innerHTML = '<div class="empty-state">' + (q ? "No encontré ninguna clienta con ese nombre o teléfono." : "Aún no tienes clientas registradas. Usa el botón + para agregar una.") + "</div>";
    return;
  }
  list.innerHTML = clients.map(function(c){
    var lv = lastVisit(c.id);
    var pill = lv ? ("Última: " + parseISO(lv.date).getDate() + " " + MONTHS[parseISO(lv.date).getMonth()].slice(0,3)) : "Sin citas aún";
    var noShows = noShowCount(c.id);
    return '<button class="client-card" data-id="' + c.id + '">' +
      '<div class="client-avatar">' + esc(initials(c.name)) + "</div>" +
      '<div class="info"><div class="name-row"><span class="name">' + esc(displayName(c.name)) + '</span>' + (c.isExample ? '<span class="ex-badge">Ejemplo</span>' : "") + (noShows > 0 ? '<span class="noshow-badge">⚠ ' + noShows + '</span>' : "") + '</div><div class="meta">' + esc(c.phone) + "</div></div>" +
      '<span class="last-pill">' + esc(pill) + "</span>" +
    "</button>";
  }).join("");
  list.querySelectorAll(".client-card").forEach(function(card){
    card.addEventListener("click", function(){ state.activeClientId = card.dataset.id; setActiveView("client-detail"); });
  });
}

}

async function renderPhotoGrid(c){
  var grid = document.getElementById("photoGrid");
  if (!grid) return;
  var thumbs = await Promise.all(c.photos.map(async function(p){
    var blob = await store.getItem("photo:" + p.id);
    if (!blob) return "";
    var url = trackUrl(URL.createObjectURL(blob));
    return '<div class="photo-thumb" data-id="' + p.id + '"><img src="' + url + '" alt="Foto de trabajo"><button class="del" data-id="' + p.id + '"><svg><use href="#i-x"/></svg></button></div>';
  }));
  grid.innerHTML = thumbs.join("") + '<button class="photo-add" id="addPhotoBtn"><svg><use href="#i-camera"/></svg></button>';
  document.getElementById("addPhotoBtn").addEventListener("click", function(){ document.getElementById("photoInput").click(); });
  grid.querySelectorAll(".del").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var pid = btn.dataset.id;
      openConfirm({ title:"Eliminar foto", message:"Esta foto se eliminará permanentemente.", confirmLabel:"Eliminar", danger:true,
        onConfirm: async function(){
          await store.removeItem("photo:" + pid);
          c.photos = c.photos.filter(function(p){ return p.id !== pid; });
          await saveClients();
          renderPhotoGrid(c);
        }});
    });
  });
}

function compressImage(file, maxW, quality){
  maxW = maxW || 900; quality = quality || 0.72;
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var scale = Math.min(1, maxW / img.width);
      var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob(function(blob){ URL.revokeObjectURL(url); blob ? resolve(blob) : reject(new Error("toBlob failed")); }, "image/jpeg", quality);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("image load failed")); };
    img.src = url;
  });
}

/* ---------------- Reporte de ingresos ---------------- */
function apptRevenue(appt){
  return (appt.services || []).reduce(function(sum, s){ return sum + (s.price || 0); }, 0);
}
function incomeRange(period){
  var now = new Date();
  if (period === "month"){
    return { start: new Date(now.getFullYear(), now.getMonth(), 1), end: new Date(now.getFullYear(), now.getMonth()+1, 0) };
  }
  var start = startOfWeek(now);
  return { start: start, end: addDays(start, 6) };
}
function incomeApptsInRange(range){
  return state.appointments.filter(function(a){
    if (a.isExample) return false;
    if (a.status !== "completada") return false;
    var d = parseISO(a.date);
    return d >= range.start && d <= range.end;
  });
}
function renderIncomeView(){
  var view = document.getElementById("view-income");
  var period = state.incomePeriod || "week";
  var range = incomeRange(period);
  var appts = incomeApptsInRange(range);
  var total = appts.reduce(function(sum, a){ return sum + apptRevenue(a); }, 0);

  var bySvc = {};
  appts.forEach(function(a){
    (a.services || []).forEach(function(s){
      if (!bySvc[s.name]) bySvc[s.name] = { count: 0, total: 0 };
      bySvc[s.name].count++;
      bySvc[s.name].total += (s.price || 0);
    });
  });
  var svcNames = Object.keys(bySvc).sort(function(x,y){ return bySvc[y].total - bySvc[x].total; });
  var svcRows = svcNames.map(function(name){
    var row = bySvc[name];
    return '<div class="income-svc-row"><span class="income-svc-name">' + esc(name) + '</span><span class="income-svc-count">' + row.count + "×</span><span class=\"income-svc-total\">" + fmtMoney(row.total) + "</span></div>";
  }).join("");

  var monthName = MONTHS[range.start.getMonth()];
  var rangeLabel = period === "month"
    ? (monthName.charAt(0).toUpperCase() + monthName.slice(1)) + " de " + range.start.getFullYear()
    : range.start.getDate() + " " + MONTHS[range.start.getMonth()].slice(0,3) + " – " + range.end.getDate() + " " + MONTHS[range.end.getMonth()].slice(0,3);

  var hasPrices = state.settings.services.some(function(sv){ return sv.price > 0; });

  view.innerHTML =
    '<div class="income-toggle">' +
      '<button class="chip-toggle' + (period === "week" ? " active" : "") + '" data-period="week">Esta semana</button>' +
      '<button class="chip-toggle' + (period === "month" ? " active" : "") + '" data-period="month">Este mes</button>' +
    "</div>" +
    (!hasPrices ? '<div class="income-tip">Todavía no les has puesto precio a tus servicios. Ve a Ajustes → Servicios para agregarlo y que este reporte calcule bien.</div>' : "") +
    '<div class="backup-card">' +
      '<div class="income-total-label">Total generado · ' + esc(rangeLabel) + '</div>' +
      '<div class="income-total-amount">' + fmtMoney(total) + '</div>' +
      '<div class="income-total-meta">' + appts.length + (appts.length === 1 ? " cita completada" : " citas completadas") + '</div>' +
    "</div>" +
    (svcRows
      ? '<div class="backup-card"><div class="section-title">Por servicio</div><div class="income-svc-list" style="margin-top:6px;">' + svcRows + "</div></div>"
      : '<p class="muted-text">Todavía no hay citas marcadas como completadas en este periodo. El reporte solo cuenta citas completadas.</p>');

  view.querySelectorAll(".chip-toggle").forEach(function(btn){
    btn.addEventListener("click", function(){ state.incomePeriod = btn.dataset.period; renderIncomeView(); });
  });
}

function browserDownload(filename, blob){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename; a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

async function buildBackupPayload(){
  var photoEntries = [];
  var allPhotoIds = [];
  state.clients.forEach(function(c){ c.photos.forEach(function(p){ allPhotoIds.push(p.id); }); });
  for (var i=0;i<allPhotoIds.length;i++){
    var blob = await store.getItem("photo:" + allPhotoIds[i]);
    if (!blob) continue;
    var b64 = await blobToBase64(blob);
    photoEntries.push({ id: allPhotoIds[i], data: b64 });
  }
  return {
    exportedAt: new Date().toISOString(),
    settings: state.settings,
    clients: state.clients,
    appointments: state.appointments,
    photos: photoEntries
  };
}

function canShareFiles(){
  return !!(navigator.share && navigator.canShare && (function(){
    try { return navigator.canShare({ files: [new File(["x"], "t.json", { type: "application/json" })] }); }
    catch(e){ return false; }
  })());
}

async function shareBackup(){
  var payload = await buildBackupPayload();
  var jsonBlob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  var filename = "respaldo-unas-" + fmtISO(new Date()) + ".json";
  var file = new File([jsonBlob], filename, { type: "application/json" });
  try {
    if (!navigator.canShare({ files: [file] })){ showToast("Tu navegador no permite compartir archivos; usa \"Descargar respaldo\""); return; }
    await navigator.share({ files: [file], title: "Respaldo Belleza al Día", text: "Respaldo de mi agenda (" + fmtISO(new Date()) + ")" });
    state.lastBackupAt = Date.now();
    await saveMeta();
    renderBackupView();
    showToast("Respaldo enviado");
  } catch(err){
    if (err && err.name === "AbortError") return; // canceló el share sheet
    showToast("No se pudo enviar el respaldo");
  }
}

async function downloadBackup(){
  var downloads = null;
  if (window.claude && window.claude.use){
    try { downloads = await window.claude.use("downloads"); } catch(e){ downloads = null; }
  }

  var payload = await buildBackupPayload();
  var jsonBlob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  var filename = "respaldo-unas-" + fmtISO(new Date()) + ".json";

  if (downloads){
    try {
      await downloads.save({ filename: filename, data: jsonBlob });
      state.lastBackupAt = Date.now();
      await saveMeta();
      renderBackupView();
      showToast("Respaldo guardado");
    } catch(err){
      if (err && err.code === "declined"){ showToast("Respaldo cancelado"); }
      else { showToast("No se pudo guardar el respaldo"); }
    }
    return;
  }

  /* No Claude "downloads" capability in this view (e.g. hosted on tu propio
     dominio) — usar la descarga estándar del navegador. */
  try {
    browserDownload(filename, jsonBlob);
    state.lastBackupAt = Date.now();
    await saveMeta();
    renderBackupView();
    showToast("Respaldo descargado");
  } catch(err){
    showToast("No se pudo generar el respaldo");
  }
}

function blobToBase64(blob){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
function base64ToBlob(dataUrl){
  return new Promise(function(resolve, reject){
    try {
      var parts = dataUrl.split(",");
      var meta = parts[0] || "";
      var mimeMatch = meta.match(/data:([^;]+);base64/);
      var mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";
      var binary = atob(parts[1] || "");
      var bytes = new Uint8Array(binary.length);
      for (var i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
      resolve(new Blob([bytes], { type: mime }));
    } catch(e){ reject(e); }
  });
}

async function restoreBackup(data){
  var oldPhotoIds = [];
  state.clients.forEach(function(c){ c.photos.forEach(function(p){ oldPhotoIds.push(p.id); }); });
  for (var i=0;i<oldPhotoIds.length;i++){ await store.removeItem("photo:" + oldPhotoIds[i]); }

  for (var j=0;j<(data.photos||[]).length;j++){
    var entry = data.photos[j];
    try { var blob = await base64ToBlob(entry.data); await store.setItem("photo:" + entry.id, blob); } catch(e){}
  }

  state.clients = data.clients || [];
  state.appointments = data.appointments || [];
  state.settings = data.settings || defaultSettings();
  state.appointments.forEach(function(ap){
    if (!Array.isArray(ap.services)){
      ap.services = ap.service ? [{ name: ap.service, durationMin: ap.durationMin || 30 }] : [];
    }
  });
  await saveClients(); await saveAppointments(); await saveSettings();
  renderBackupView();
  showToast("Respaldo restaurado");
}

var LICENSE_SHEET_CSV_URL = "https://gist.githubusercontent.com/Kaiser1970/2f6506866c9829cb620cf7cf0a177f7e/raw/licencias.json";
var LICENSE_ENABLED = LICENSE_SHEET_CSV_URL.indexOf("PEGA_AQUI") === -1;
var LICENSE_GRACE_DAYS = 5;       // días que sigue funcionando sin internet si ya estaba activa
var LICENSE_RECHECK_HOURS = 12;   // no vuelve a consultar la hoja antes de este tiempo si ya estaba activa
var LICENSE_TRIAL_DAYS = 10;      // días de prueba gratis para un salón nuevo, desde que avisa por WhatsApp
var LICENSE_CONTACT_TEXT = "Para activar o reactivar tu cuenta, contáctanos.";
var LICENSE_CONTACT_WHATSAPP = "528180927453"; // tu número de WhatsApp con código de país

function normalizeLic(s){ return (s || "").toString().trim().toLowerCase(); }
function isActiveStatus(s){
  var v = normalizeLic(s);
  return v === "si" || v === "sí" || v === "activo" || v === "yes" || v === "true" || v === "1";
}
function parseCsv(text){
  var rows = [], row = [], field = "", inQuotes = false;
  for (var i = 0; i < text.length; i++){
    var c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else field += c;
    } else if (c === '"'){ inQuotes = true; }
    else if (c === ','){ row.push(field); field = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.length > 1 || (r[0] || "").trim() !== ""; });
}
async function fetchLicenseRow(salonName){
  var controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var timer = controller ? setTimeout(function(){ controller.abort(); }, 8000) : null;
  try {
    var res = await fetch(LICENSE_SHEET_CSV_URL, { cache: "no-store", signal: controller ? controller.signal : undefined });
    if (timer) clearTimeout(timer);
    if (!res.ok) throw new Error("http " + res.status);
    var text = await res.text();
    var target = normalizeLic(salonName);

    /* Formato JSON simple — ideal si hospedas el archivo en tu propio
       servidor: { "Nombre del salón": { "estatus": "SI", "notas": "..." } } */
    var asJson = null;
    try { asJson = JSON.parse(text); } catch(e0){ asJson = null; }
    if (asJson && typeof asJson === "object" && !Array.isArray(asJson)){
      var keys = Object.keys(asJson);
      for (var k = 0; k < keys.length; k++){
        if (normalizeLic(keys[k]) === target){
          var rec = asJson[keys[k]] || {};
          return { ok: true, found: true, active: isActiveStatus(rec.estatus || rec.status || rec.Estatus) };
        }
      }
      return { ok: true, found: false };
    }

    /* Formato CSV — el que genera "Publicar en la web" de Google Sheets */
    var rows = parseCsv(text);
    if (!rows.length) throw new Error("archivo vacío");
    var header = rows[0].map(normalizeLic);
    var salonIdx = header.indexOf("salon"); if (salonIdx === -1) salonIdx = header.indexOf("salón");
    var statusIdx = header.indexOf("estatus"); if (statusIdx === -1) statusIdx = header.indexOf("estado");
    if (salonIdx === -1) salonIdx = 0;
    if (statusIdx === -1) statusIdx = 1;
    for (var i = 1; i < rows.length; i++){
      if (normalizeLic(rows[i][salonIdx]) === target){
        return { ok: true, found: true, active: isActiveStatus(rows[i][statusIdx]) };
      }
    }
    return { ok: true, found: false };
  } catch(e){
    if (timer) clearTimeout(timer);
    return { ok: false, error: e };
  }
}

    if (LICENSE_CONTACT_WHATSAPP){
      waHtml = '<a class="btn btn-primary btn-block btn-icon" id="gateWaBtn" style="margin-top:8px;" href="' +
        waLink(LICENSE_CONTACT_WHATSAPP, "Hola, quiero reactivar mi cuenta de \"" + lic.salonName + "\" en Belleza al Día.") +
        '" target="_blank" rel="noopener"><svg><use href="#i-whatsapp"/></svg>Contactar por WhatsApp</a>';
    }
  }

  renderGate(
    "<h1>" + esc(title) + "</h1><p class=\"muted-text\">" + esc(msg) + "</p>" +
    waHtml +
    '<button class="btn btn-secondary btn-block" id="gateRetryBtn" style="margin-top:8px;">Reintentar</button>' +
    (showFixName ? '<button class="btn btn-secondary btn-block" id="gateFixNameBtn" style="margin-top:8px;">Corregir nombre del salón</button>' : "")
  );

  var waBtnEl = document.getElementById("gateWaBtn");
  if (waBtnEl && reason === "not-found"){
    waBtnEl.addEventListener("click", function(){
      lic.status = "prueba";
      lic.trialStartedAt = Date.now();
      store.setItem("license", lic);
      startApp();
      showToast("¡Listo! Tienes " + LICENSE_TRIAL_DAYS + " días de prueba gratis.");
      showTrialBanner(LICENSE_TRIAL_DAYS);
    });
  }

  document.getElementById("gateRetryBtn").addEventListener("click", async function(){
    renderGateLoading();
    if (reason === "trial-expired"){
      var result = await fetchLicenseRow(lic.salonName);
      if (result.ok && result.found && result.active){
        lic.status = "activo"; lic.lastCheckedAt = Date.now(); delete lic.trialStartedAt;
        await store.setItem("license", lic);
        startApp();
        return;
      }
      renderLockedScreen(lic, "trial-expired");
      return;
    }
    await performLicenseCheck(lic);
  });
  var fixBtn = document.getElementById("gateFixNameBtn");
  if (fixBtn) fixBtn.addEventListener("click", function(){ renderActivationForm(lic.salonName); });
}

async function performLicenseCheck(lic){
  var result = await fetchLicenseRow(lic.salonName);
  var now = Date.now();
  if (result.ok && result.found){
    lic.status = result.active ? "activo" : "bloqueado";
    lic.lastCheckedAt = now;
    await store.setItem("license", lic);
    if (result.active) startApp(); else renderLockedScreen(lic, "blocked");
    return;
  }
  if (result.ok && !result.found){
    lic.status = "bloqueado"; lic.lastCheckedAt = now;
    await store.setItem("license", lic);
    renderLockedScreen(lic, "not-found");
    return;
  }
  var graceMs = LICENSE_GRACE_DAYS * 86400000;
  var withinGrace = lic.status === "activo" && lic.lastCheckedAt && (now - lic.lastCheckedAt) < graceMs;
  if (withinGrace) startApp(); else renderLockedScreen(lic, "offline");
}

async function bootLicenseGate(){
  if (!LICENSE_ENABLED){ startApp(); return; }
  var lic = await store.getItem("license");
  if (!lic || !lic.salonName){ renderActivationForm(); return; }
  var now = Date.now();

  /* Prueba gratis en curso: la dejamos trabajar sin depender de internet,
     y de paso intentamos confirmar en segundo plano si ya la activaron. */
  if (lic.status === "prueba"){
    var left = trialDaysLeft(lic);
    if (left > 0){
      startApp();
      showTrialBanner(left);
      refreshTrialInBackground(lic);
      return;
    }
    lic.status = "prueba-vencida";
    await store.setItem("license", lic);
    // sigue abajo para intentar un último chequeo antes de bloquear
  }

  if (lic.status === "prueba-vencida"){
    renderGateLoading();
    var result = await fetchLicenseRow(lic.salonName);
    if (result.ok && result.found && result.active){
      lic.status = "activo"; lic.lastCheckedAt = now; delete lic.trialStartedAt;
      await store.setItem("license", lic);
      startApp();
      return;
    }
    renderLockedScreen(lic, "trial-expired");
    return;
  }

  var recheckMs = LICENSE_RECHECK_HOURS * 3600000;
  if (lic.status === "activo" && lic.lastCheckedAt && (now - lic.lastCheckedAt) < recheckMs){ startApp(); return; }
  renderGateLoading();
  await performLicenseCheck(lic);
}

/* ---------------- Init ---------------- */
bootLicenseGate();

})();
</script>
</body>
</html>
