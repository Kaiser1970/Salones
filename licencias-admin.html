<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Panel de Licencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F2F4; --surface:#FFFFFF; --surface-2:#FBEEF3;
    --ink:#241820; --ink-soft:#7A6670; --ink-faint:#B7A3AC; --border:#EAD9E0;
    --accent:#D6336C; --accent-ink:#FFFFFF; --accent-soft:#FBE1EA; --nude:#C9A66B;
    --success:#3F8563; --success-soft:#E1F0E7;
    --warning:#C68A2E; --warning-soft:#FBEEDA;
    --danger:#C4423F; --danger-soft:#FBE3E1;
    --shadow:0 10px 28px -14px rgba(36,24,32,.35);
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
    --font-display:'Fraunces','Iowan Old Style',serif;
    --font-body:'Archivo',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1218; --surface:#241820; --surface-2:#2C1E27;
      --ink:#F5E9EF; --ink-soft:#C2A9B4; --ink-faint:#8C7480; --border:#3B2A33;
      --accent:#F0578C; --accent-ink:#241017; --accent-soft:#3D2430; --nude:#DCB983;
      --success:#6FB78F; --success-soft:#1F3A2C;
      --warning:#E0AC58; --warning-soft:#3D2E14;
      --danger:#E37F7B; --danger-soft:#3E211F;
      --shadow:0 10px 30px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1218; --surface:#241820; --surface-2:#2C1E27;
    --ink:#F5E9EF; --ink-soft:#C2A9B4; --ink-faint:#8C7480; --border:#3B2A33;
    --accent:#F0578C; --accent-ink:#241017; --accent-soft:#3D2430; --nude:#DCB983;
    --success:#6FB78F; --success-soft:#1F3A2C;
    --warning:#E0AC58; --warning-soft:#3D2E14;
    --danger:#E37F7B; --danger-soft:#3E211F;
    --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); min-height:100vh; margin:0;}
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
  button{font-family:var(--font-body);}
  [hidden]{display:none !important;}

  .app{max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); position:relative; isolation:isolate;}
  @media (min-width:560px){
    body{padding:32px 16px;}
    .app{min-height:calc(100vh - 64px); border-radius:28px; box-shadow:var(--shadow); overflow:hidden; border:1px solid var(--border);}
  }

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5;}
  .brand{display:flex; flex-direction:column; min-width:0;}
  .brand h1{font-size:1.1rem; font-weight:600;}
  .brand span{font-size:.72rem; color:var(--ink-soft); font-weight:600;}
  .icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:grid; place-items:center; color:var(--ink-soft); cursor:pointer; flex-shrink:0;}
  .icon-btn svg{width:17px; height:17px;}
  .icon-btn:hover{background:var(--surface-2);}
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .view{flex:1; overflow-y:auto; padding:14px 14px 96px; display:flex; flex-direction:column; gap:14px; -webkit-overflow-scrolling:touch;}

  .stats-row{display:flex; gap:8px;}
  .stat-card{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 8px; text-align:center;}
  .stat-card .num{font-family:var(--font-display); font-size:1.3rem; font-weight:700;}
  .stat-card .lbl{font-size:.66rem; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .stat-card.activos .num{color:var(--success);}
  .stat-card.pausados .num{color:var(--danger);}

  .search-row input{width:100%; padding:11px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:.9rem;}

  .salon-list{display:flex; flex-direction:column; gap:8px;}
  .salon-card{display:flex; align-items:center; gap:10px; padding:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);}
  .salon-main{flex:1; min-width:0; cursor:pointer;}
  .salon-name{font-weight:700; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .salon-notes{font-size:.76rem; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
  .status-pill{display:inline-flex; align-items:center; gap:4px; font-size:.64rem; font-weight:700; padding:3px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; margin-top:4px;}
  .status-pill.activo{background:var(--success-soft); color:var(--success);}
  .status-pill.pausado{background:var(--danger-soft); color:var(--danger);}

  .toggle-btn{flex-shrink:0; padding:8px 12px; border-radius:999px; border:none; font-weight:700; font-size:.76rem; cursor:pointer;}
  .toggle-btn.to-activo{background:var(--success-soft); color:var(--success);}
  .toggle-btn.to-pausado{background:var(--danger-soft); color:var(--danger);}
  .toggle-btn[disabled]{opacity:.5; cursor:wait;}
  .edit-btn{flex-shrink:0; width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:grid; place-items:center; color:var(--ink-soft); cursor:pointer;}
  .edit-btn svg{width:15px; height:15px;}
  .edit-btn:hover{background:var(--surface-2);}

  .empty-state{text-align:center; color:var(--ink-faint); padding:34px 20px; font-size:.86rem; background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius-lg);}

  .fab{position:absolute; right:18px; bottom:24px; width:52px; height:52px; border-radius:50%; background:var(--accent); color:var(--accent-ink); border:none; display:grid; place-items:center; box-shadow:var(--shadow); cursor:pointer; z-index:8;}
  .fab svg{width:24px; height:24px;}

  .sheet-backdrop{position:fixed; inset:0; background:rgba(20,12,16,.42); display:flex; align-items:flex-end; z-index:20;}
  @media (min-width:560px){ .sheet-backdrop{position:absolute;} }
  .sheet{background:var(--surface); width:100%; max-height:90vh; overflow-y:auto; border-radius:22px 22px 0 0; padding:10px 18px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow); animation:sheet-in .2s ease; margin:0 auto; max-width:460px;}
  @keyframes sheet-in{from{transform:translateY(18px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; border-radius:2px; background:var(--border); margin:6px auto 0;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .sheet-title{font-size:1.1rem; font-weight:600;}

  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:.72rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field textarea{width:100%; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:.92rem;}
  .field textarea{resize:vertical; min-height:56px;}

  .status-choice{display:flex; gap:8px;}
  .status-choice button{flex:1; padding:10px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--surface); font-weight:700; font-size:.85rem; cursor:pointer; color:var(--ink-soft);}
  .status-choice button.active.act-si{border-color:var(--success); background:var(--success-soft); color:var(--success);}
  .status-choice button.active.act-no{border-color:var(--danger); background:var(--danger-soft); color:var(--danger);}

  .btn{padding:12px 16px; border-radius:999px; border:none; font-weight:700; font-size:.9rem; cursor:pointer;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-secondary{background:var(--surface-2); color:var(--ink);}
  .btn-danger{background:var(--danger-soft); color:var(--danger);}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}

  .toast{position:fixed; left:50%; bottom:28px; transform:translate(-50%,6px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.82rem; font-weight:700; box-shadow:var(--shadow); z-index:40; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; max-width:88%; text-align:center;}
  .toast.show{opacity:1; transform:translate(-50%,0);}

  .gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg);}
  .gate-card{max-width:340px; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px 26px; text-align:center; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px;}
  .gate-icon{width:34px; height:34px; color:var(--accent); margin:0 auto 8px;}
  .gate-card h1{font-size:1.25rem; margin-bottom:2px;}
  .gate-card .field{margin-top:14px; text-align:left;}
  .error-text{color:var(--danger); font-size:.8rem; font-weight:600; min-height:1.1em;}
  .muted-text{font-size:.82rem; color:var(--ink-soft); line-height:1.5;}
  .gate-card a{color:var(--accent); font-weight:600;}
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.2 8.5-7 10-3.8-1.5-7-5-7-10V6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H6a2 2 0 00-2 2v12a2 2 0 002 2h3M16 16l4-4-4-4M20 12H9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l.9-3.6L16 5.3a1.5 1.5 0 012.1 0l.6.6a1.5 1.5 0 010 2.1L7.6 19.1 4 20z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></symbol>
</svg>

<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <svg class="gate-icon"><use href="#i-shield"/></svg>
    <h1>Panel de Licencias</h1>
    <p class="muted-text">Escribe la contraseña del panel para entrar.</p>
    <div class="field"><label>Contraseña</label><input type="password" id="gatePass" autocomplete="off" placeholder="••••••••"></div>
    <p class="error-text" id="gateError"></p>
    <button class="btn btn-primary btn-block" id="gateBtn" style="margin-top:6px;">Entrar</button>
  </div>
</div>

<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="brand"><h1>Panel de Licencias</h1><span>Uñas al Día</span></div>
    <button class="icon-btn" id="logoutBtn" aria-label="Cerrar sesión"><svg><use href="#i-logout"/></svg></button>
  </header>

  <main class="view">
    <div class="stats-row">
      <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">Salones</div></div>
      <div class="stat-card activos"><div class="num" id="statActivos">0</div><div class="lbl">Activos</div></div>
      <div class="stat-card pausados"><div class="num" id="statPausados">0</div><div class="lbl">Pausados</div></div>
    </div>
    <div class="search-row"><input id="searchInput" placeholder="Buscar salón..." autocomplete="off"></div>
    <button type="button" class="btn btn-secondary btn-block" id="importBtn" hidden>Importar salones desde GitHub (una sola vez)</button>
    <div class="salon-list" id="salonList"></div>
  </main>

  <button class="fab" id="fabBtn" aria-label="Agregar salón"><svg><use href="#i-plus"/></svg></button>
  <div class="toast" id="toast"></div>
</div>

<div id="modalRoot"></div>

<script>
(function(){
"use strict";

/* ================================================================
   CONFIGURACIÓN — este panel guarda y lee tus salones en un archivo
   licencias.json hospedado en tu propio dominio, a través de un
   pequeño servicio (api-licencias.php) que también debe estar
   subido ahí. Ya no depende de GitHub ni de un token que caduque.

   Debes tener subidos, en la MISMA carpeta de tu hosting:
     - licencias.json
     - api-licencias.php  (con tu contraseña puesta adentro)

   Ajusta API_URL si cambias de dominio o de carpeta.
================================================================== */
var API_URL = "https://www.jehersa.com/licencias/api-licencias.php";

var PASS_KEY = "licAdminApiPass";
var salones = {}; // { nombre: {estatus, notas} }

function esc(s){ return (s == null ? "" : String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------------- Toast ---------------- */
var toastTimer = null;
function showToast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2400);
}

/* ---------------- Sheet helper ---------------- */
function closeSheet(){ document.getElementById("modalRoot").innerHTML = ""; }
function openSheet(innerHTML, onMount){
  var root = document.getElementById("modalRoot");
  var backdrop = document.createElement("div");
  backdrop.className = "sheet-backdrop";
  backdrop.innerHTML = '<div class="sheet"><div class="sheet-handle"></div>' + innerHTML + "</div>";
  backdrop.addEventListener("mousedown", function(e){ if (e.target === backdrop) closeSheet(); });
  root.innerHTML = "";
  root.appendChild(backdrop);
  if (onMount) onMount(backdrop);
}

/* ---------------- API en tu dominio (api-licencias.php) ---------------- */
function apiPost(body){
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function(res){ return res.json().then(function(data){ return { status: res.status, data: data }; }); });
}
function apiAuth(password){
  return apiPost({ action: "auth", password: password });
}
function apiLoad(){
  return fetch(API_URL, { cache: "no-store" })
    .then(function(res){ return res.json().then(function(data){ return { status: res.status, data: data }; }); })
    .then(function(r){
      if (r.status !== 200 || !r.data || !r.data.ok) return { status: r.status };
      return { status: 200, salones: r.data.salones || {} };
    });
}
function apiSave(salon, estatus, notas, oldSalon){
  var password = localStorage.getItem(PASS_KEY) || "";
  return apiPost({ action: "set", password: password, salon: salon, estatus: estatus, notas: notas, oldSalon: oldSalon || "" });
}
function apiDelete(salon){
  var password = localStorage.getItem(PASS_KEY) || "";
  return apiPost({ action: "delete", password: password, salon: salon });
}
function apiImport(allSalones){
  var password = localStorage.getItem(PASS_KEY) || "";
  return apiPost({ action: "import", password: password, salones: allSalones });
}

/* ---------------- Render ---------------- */
function renderList(){
  var q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
  var names = Object.keys(salones).filter(function(n){ return n.toLowerCase().indexOf(q) !== -1; }).sort(function(a,b){ return a.localeCompare(b, "es"); });

  var total = Object.keys(salones).length;
  var activos = Object.keys(salones).filter(function(n){ return salones[n].estatus === "SI"; }).length;
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statActivos").textContent = activos;
  document.getElementById("statPausados").textContent = total - activos;
  document.getElementById("importBtn").hidden = total !== 0;

  var list = document.getElementById("salonList");
  if (!names.length){
    list.innerHTML = '<div class="empty-state">' + (total === 0 ? "Todavía no tienes salones registrados. Toca el botón + para agregar el primero." : "Ningún salón coincide con tu búsqueda.") + "</div>";
    return;
  }

  list.innerHTML = names.map(function(name){
    var s = salones[name];
    var isActive = s.estatus === "SI";
    return '<div class="salon-card" data-name="' + esc(name) + '">' +
      '<div class="salon-main" data-action="edit">' +
        '<div class="salon-name">' + esc(name) + "</div>" +
        (s.notas ? '<div class="salon-notes">' + esc(s.notas) + "</div>" : "") +
        '<span class="status-pill ' + (isActive ? "activo" : "pausado") + '">' + (isActive ? "Activo" : "Pausado") + "</span>" +
      "</div>" +
      '<button type="button" class="edit-btn" data-action="edit-btn" aria-label="Editar nombre o notas"><svg><use href="#i-pencil"/></svg></button>' +
      '<button type="button" class="toggle-btn ' + (isActive ? "to-pausado" : "to-activo") + '" data-action="toggle">' + (isActive ? "Pausar" : "Activar") + "</button>" +
    "</div>";
  }).join("");

  list.querySelectorAll(".salon-card").forEach(function(card){
    var name = card.dataset.name;
    card.querySelector('[data-action="edit"]').addEventListener("click", function(){ openEditSheet(name); });
    card.querySelector('[data-action="edit-btn"]').addEventListener("click", function(){ openEditSheet(name); });
    card.querySelector('[data-action="toggle"]').addEventListener("click", function(){ quickToggle(name, card.querySelector('[data-action="toggle"]')); });
  });
}

function handleSaveError(r, btn){
  if (btn) btn.disabled = false;
  if (r.status === 401){ showToast("Tu contraseña ya no es válida, vuelve a entrar"); logout(); }
  else if (r.status === 404 || r.status === 0){ showToast("No se pudo conectar con tu servidor (revisa API_URL)"); }
  else { showToast("No se pudo guardar el cambio"); }
}

function quickToggle(name, btn){
  var current = salones[name];
  var newStatus = current.estatus === "SI" ? "NO" : "SI";
  btn.disabled = true;
  apiSave(name, newStatus, current.notas || "").then(function(r){
    btn.disabled = false;
    if (r.status === 200 && r.data && r.data.ok){
      salones[name] = { estatus: newStatus, notas: current.notas || "" };
      renderList();
      showToast(newStatus === "SI" ? '"' + name + '" activado' : '"' + name + '" pausado');
    } else { handleSaveError(r, btn); }
  }).catch(function(){ btn.disabled = false; showToast("Sin conexión — inténtalo de nuevo"); });
}

/* ---------------- Add / edit sheet ---------------- */
function salonFormHTML(existingName){
  var s = existingName ? salones[existingName] : null;
  var isActive = s ? s.estatus === "SI" : true;
  return (
    '<div class="sheet-head"><div class="sheet-title">' + (existingName ? "Editar salón" : "Nuevo salón") + '</div><button class="icon-btn" id="fClose"><svg><use href="#i-x"/></svg></button></div>' +
    '<div class="field"><label>Nombre del salón</label><input type="text" id="fName" value="' + esc(existingName || "") + '" placeholder="Debe coincidir con el que ella escribió en la app"></div>' +
    (existingName ? '<p class="muted-text" style="margin-top:-6px;">Si tenía una letra mal escrita, corrígelo aquí para que quede EXACTAMENTE igual al nombre que la clienta escribió en su celular. Ella no tiene que hacer nada — su acceso se valida solo, la próxima vez que la app revise su estatus.</p>' : "") +
    '<div class="field"><label>Estatus</label><div class="status-choice">' +
      '<button type="button" class="act-si' + (isActive ? " active" : "") + '" data-val="SI">Activo</button>' +
      '<button type="button" class="act-no' + (!isActive ? " active" : "") + '" data-val="NO">Pausado</button>' +
    "</div></div>" +
    '<div class="field"><label>Notas (opcional)</label><textarea id="fNotas" placeholder="Ej. pagó el 5 de septiembre">' + esc(s ? s.notas || "" : "") + "</textarea></div>" +
    '<div class="btn-row" style="margin-top:4px;">' +
      (existingName ? '<button class="btn btn-danger" id="fDelete"><svg style="width:15px;height:15px;vertical-align:-2px;margin-right:5px;"><use href="#i-trash"/></svg>Eliminar</button>' : "") +
      '<button class="btn btn-primary" id="fSave">Guardar</button>' +
    "</div>"
  );
}

function openAddSheet(){
  openSheet(salonFormHTML(null), function(root){ wireForm(root, null); });
}
function openEditSheet(name){
  openSheet(salonFormHTML(name), function(root){ wireForm(root, name); });
}

function wireForm(root, existingName){
  var $ = function(sel){ return root.querySelector(sel); };
  var fName = $("#fName"), fNotas = $("#fNotas"), fSave = $("#fSave"), fClose = $("#fClose"), fDelete = $("#fDelete");
  var chosenStatus = existingName && salones[existingName] && salones[existingName].estatus === "NO" ? "NO" : "SI";

  root.querySelectorAll(".status-choice button").forEach(function(btn){
    btn.addEventListener("click", function(){
      chosenStatus = btn.dataset.val;
      root.querySelectorAll(".status-choice button").forEach(function(b){ b.classList.toggle("active", b === btn); });
    });
  });

  fClose.addEventListener("click", closeSheet);

  fSave.addEventListener("click", function(){
    var name = fName.value.trim();
    if (!name){ fName.focus(); showToast("Escribe el nombre del salón"); return; }
    var renamed = existingName && existingName !== name;
    if (renamed && Object.prototype.hasOwnProperty.call(salones, name)){
      showToast('Ya existe otro salón registrado como "' + name + '" — elige un nombre distinto o corrígelo primero');
      fName.focus();
      return;
    }
    var notas = fNotas.value.trim();
    fSave.disabled = true;
    apiSave(name, chosenStatus, notas, renamed ? existingName : "").then(function(r){
      fSave.disabled = false;
      if (r.status === 200 && r.data && r.data.ok){
        if (renamed){ delete salones[existingName]; }
        salones[name] = { estatus: chosenStatus, notas: notas };
        renderList();
        closeSheet();
        showToast(renamed ? 'Renombrado a "' + name + '"' : (existingName ? "Cambios guardados" : '"' + name + '" agregado'));
      } else { handleSaveError(r, fSave); }
    }).catch(function(){ fSave.disabled = false; showToast("Sin conexión — inténtalo de nuevo"); });
  });

  if (fDelete){
    fDelete.addEventListener("click", function(){
      if (!confirm('¿Eliminar "' + existingName + '" del registro? Esto la bloqueará por completo.')) return;
      fDelete.disabled = true;
      apiDelete(existingName).then(function(r){
        fDelete.disabled = false;
        if (r.status === 200 && r.data && r.data.ok){
          delete salones[existingName];
          renderList();
          closeSheet();
          showToast('"' + existingName + '" eliminado');
        } else { handleSaveError(r, fDelete); }
      }).catch(function(){ fDelete.disabled = false; showToast("Sin conexión — inténtalo de nuevo"); });
    });
  }
}

/* ---------------- Importar desde el Gist viejo (una sola vez) ---------------- */
var OLD_GIST_ID = "2f6506866c9829cb620cf7cf0a177f7e";
var OLD_GIST_FILENAME = "licencias.json";
function importFromGithub(){
  var token = prompt("Pega aquí tu token de GitHub de antes (el mismo 'ghp_...' que usabas para entrar al panel viejo). Esto solo se usa una vez, para traer tus salones ya guardados.");
  if (!token) return;
  var btn = document.getElementById("importBtn");
  btn.disabled = true;
  btn.textContent = "Importando...";
  fetch("https://api.github.com/gists/" + OLD_GIST_ID, {
    headers: { "Authorization": "token " + token, "Accept": "application/vnd.github+json" },
    cache: "no-store"
  }).then(function(res){ return res.json().then(function(data){ return { status: res.status, data: data }; }); })
    .then(function(r){
      if (r.status !== 200){ throw new Error("gist-" + r.status); }
      var file = r.data.files && r.data.files[OLD_GIST_FILENAME];
      var parsed = {};
      if (file && file.content){ try { parsed = JSON.parse(file.content) || {}; } catch(e){ parsed = {}; } }
      var count = Object.keys(parsed).length;
      if (!count){ throw new Error("empty"); }
      return apiImport(parsed);
    })
    .then(function(r){
      btn.disabled = false;
      btn.textContent = "Importar salones desde GitHub (una sola vez)";
      if (r.status === 200 && r.data && r.data.ok){
        salones = r.data.salones || {};
        renderList();
        showToast("Salones importados correctamente");
      } else {
        showToast("No se pudo guardar en tu servidor");
      }
    })
    .catch(function(e){
      btn.disabled = false;
      btn.textContent = "Importar salones desde GitHub (una sola vez)";
      if (e && e.message === "empty"){ showToast("El Gist no tiene salones guardados"); }
      else if (e && e.message === "gist-401"){ showToast("Ese token de GitHub no es válido"); }
      else { showToast("No se pudo conectar con GitHub"); }
    });
}
document.getElementById("importBtn").addEventListener("click", importFromGithub);

/* ---------------- Auth / boot ---------------- */
function showApp(){
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  renderList();
}
function showGate(msg){
  document.getElementById("app").hidden = true;
  document.getElementById("gate").hidden = false;
  document.getElementById("gateError").textContent = msg || "";
  document.getElementById("gatePass").focus();
}
function logout(){
  localStorage.removeItem(PASS_KEY);
  showGate("");
}

function tryEnter(password){
  var btn = document.getElementById("gateBtn");
  btn.disabled = true;
  apiAuth(password).then(function(r){
    if (r.status !== 200 || !r.data || !r.data.ok){
      btn.disabled = false;
      showGate(r.status === 401 ? "Contraseña incorrecta" : "No se pudo conectar con tu servidor");
      return;
    }
    localStorage.setItem(PASS_KEY, password);
    apiLoad().then(function(r2){
      btn.disabled = false;
      if (r2.status === 200){ salones = r2.salones; showApp(); }
      else { showGate("No se pudo cargar la lista de salones"); }
    }).catch(function(){ btn.disabled = false; showGate("Sin conexión — inténtalo de nuevo"); });
  }).catch(function(){
    btn.disabled = false;
    showGate("Sin conexión — inténtalo de nuevo");
  });
}

document.getElementById("gateBtn").addEventListener("click", function(){
  var password = document.getElementById("gatePass").value.trim();
  if (!password) return;
  tryEnter(password);
});
document.getElementById("gatePass").addEventListener("keydown", function(e){
  if (e.key === "Enter") document.getElementById("gateBtn").click();
});
document.getElementById("logoutBtn").addEventListener("click", logout);
document.getElementById("fabBtn").addEventListener("click", openAddSheet);
document.getElementById("searchInput").addEventListener("input", renderList);

var savedPass = localStorage.getItem(PASS_KEY);
if (savedPass){
  apiLoad().then(function(r){
    if (r.status === 200){ salones = r.salones; showApp(); }
    else { showGate(""); }
  }).catch(function(){ showGate(""); });
} else {
  showGate("");
}

})();
</script>
